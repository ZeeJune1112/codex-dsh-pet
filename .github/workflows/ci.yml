name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run typecheck:client
      - run: npm test
      - run: npm run build
      - run: npm run verify:hooks
      - run: npm run verify:pipeline
      - run: npm run verify:management
      - run: npm run verify:client-registration
      - run: npm pack --dry-run
